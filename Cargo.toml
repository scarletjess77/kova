[workspace]
resolver = "3"
members = ["crates/kova-core", "crates/kova-engine", "crates/kova-service", "src-tauri"]

[workspace.package]
version = "0.2.10"
authors = ["scarletjess77"]
repository = "https://github.com/scarletjess77/kova"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.lints.cargo]
# A dependency nobody uses slows every build and widens what the release has to trust.
# Kept at "warn": a dependency used only under #[cfg(windows)] would look unused when CI
# builds Linux, macOS or Android. Make it "deny" once those logs show no warning.
unused_dependencies = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
