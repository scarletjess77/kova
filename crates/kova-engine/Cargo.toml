[package]
name = "kova-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kova-core = { version = "0.1.0", path = "../kova-core" }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "charset", "gzip", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }
zip = "9.0.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Networking_WinInet", "Win32_Security"] }
winreg = "0.56.0"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
