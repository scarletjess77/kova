[package]
name = "kova"
description = "Kova: a VPN client for Mihomo and Xray"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kova_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
kova-core = { path = "../crates/kova-core" }
kova-engine = { path = "../crates/kova-engine" }
kova-service = { path = "../crates/kova-service" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "2.6.0"
uuid = { version = "1.28.0", features = ["v4"] }
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
tauri-plugin-barcode-scanner = "2.5.3"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
