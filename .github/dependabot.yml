# Weekly pull requests for outdated dependencies, grouped so there are few of them. The
# workflow actions are pinned to commits, and this is what keeps those pins current.
# They go to main, which releases are made from: an update left on another branch
# never reaches a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
