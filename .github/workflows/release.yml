# Builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
# The release is created as a draft: check it, then press "Publish" on GitHub.
# Publishing makes it "latest", which is when installed copies of Kova see the update.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: Kova only installs updates signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kova ${{ github.ref_name }}
          releaseBody: "Changes in this release:"
          releaseDraft: true
          includeUpdaterJson: true
          args: '--bundles nsis --config {"bundle":{"createUpdaterArtifacts":true}}'
