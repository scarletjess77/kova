# Builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
# The release is created as a draft: check it, then press "Publish" on GitHub.
# Publishing makes it "latest", which is when installed copies of Kova see the update.
#
# Every action is pinned to a commit: these jobs hold the signing keys, and a moved tag
# in someone else's repository must not change what runs here.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # One cache per system image: C code built against a newer glibc doesn't link
          # on an older one.
          key: ${{ matrix.os }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: Kova only installs updates signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kova ${{ github.ref_name }}
          releaseBody: "Changes in this release:"
          releaseDraft: true
          # Tags like v0.2.0-alpha.1 become pre-releases: never "latest", so installed
          # copies don't update to them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ format('--bundles {0} {1} --config {{"bundle":{{"createUpdaterArtifacts":true}}}}', matrix.bundles, matrix.target && format('--target {0}', matrix.target) || '') }}

  android:
    # After the desktop builds, which create the draft release the APK is added to. It
    # runs even when one desktop build failed: the others made the release.
    needs: desktop
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Cores for Android
        run: node scripts/android-cores.mjs arm64-v8a armeabi-v7a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One APK per processor: 64-bit phones, and 32-bit phones and TVs. Each build gets
      # only its own cores, so an APK never lists a processor it can't run on.
      - name: Build the APKs
        env:
          # The APK signing key: every release must use the same one to install as an update.
          KEYSTORE_BASE64: ${{ secrets.KOVA_ANDROID_KEYSTORE }}
          KOVA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOVA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kova.jks"
          export KOVA_ANDROID_KEYSTORE="$RUNNER_TEMP/kova.jks"
          libs=src-tauri/gen/android/app/src/main/jniLibs
          mkdir -p "$RUNNER_TEMP/aside"
          for pair in "aarch64 arm64-v8a arm64" "armv7 armeabi-v7a armv7"; do
            set -- $pair
            other=$( [ "$2" = arm64-v8a ] && echo armeabi-v7a || echo arm64-v8a )
            mv "$libs/$other" "$RUNNER_TEMP/aside/"
            npx tauri android build --apk --target "$1"
            cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)" "Kova_${GITHUB_REF_NAME#v}_android-$3.apk"
            mv "$RUNNER_TEMP/aside/$other" "$libs/"
          done
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Kova_*_android-*.apk --clobber
