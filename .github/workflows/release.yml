# Builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
# The release is created as a draft: check it, then press "Publish" on GitHub.
# Publishing makes it "latest", which is when installed copies of Kova see the update.
#
# The release page gets one installer per system with a plain name (Kova_1.2.3_Windows.exe,
# _macOS.dmg, _Linux.AppImage and _Linux.deb, _Android.apk), plus the two files the
# desktop updater reads: latest.json and the Mac app's .app.tar.gz.
#
# Every build runs at once, each in its own job. A push to main builds the same things
# without releasing them: GitHub lets a tag's run reuse only caches made on main, so
# that is what keeps the next release from compiling everything from scratch.
#
# Every action is pinned to a commit: these jobs hold the signing keys, and a moved tag
# in someone else's repository must not change what runs here.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Build only some platforms (a test build of one change)
        type: choice
        options: [all, android, desktop]
        default: all

permissions:
  contents: write

env:
  # A run for a version tag publishes; any other run only builds.
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  desktop:
    if: inputs.only != 'android'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `system` names the files on the release page: Kova_<version>_<system>.exe and so on.
          - os: windows-latest
            bundles: nsis
            system: Windows
          - os: ubuntu-22.04
            bundles: deb
            system: Linux
          # The AppImage already carries WebKit and GTK (most of its size), so it skips
          # the bundled cores and downloads them on first start; the .deb keeps them for
          # places where GitHub is blocked.
          - os: ubuntu-22.04
            bundles: appimage
            no_cores: true
            system: Linux
          # One app for Apple silicon and Intel Macs: Rust builds both, one after the
          # other, and the bundled cores hold both too.
          - os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            system: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets || matrix.target }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # One cache per system image and target: C code built against a newer glibc
          # doesn't link on an older one. Saved on main only, where tags can reach it.
          key: ${{ matrix.os }}-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # The installer carries verified cores and routing data, so a first start needs
      # nothing from GitHub, which is blocked in some countries.
      - name: Cores for the installer
        if: ${{ !matrix.no_cores }}
        run: cargo run -q -p kova-engine --example bundle_cores -- src-tauri/resources/cores ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key: Kova only installs updates signed with it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Without a tag name the action only builds.
          tagName: ${{ env.RELEASE == 'true' && github.ref_name || '' }}
          releaseName: Kova ${{ github.ref_name }}
          releaseBody: "Changes in this release:"
          releaseDraft: true
          # Tags like v0.2.0-alpha.1 become pre-releases: never "latest", so installed
          # copies don't update to them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # latest.json is written once, by the updater job below.
          includeUpdaterJson: false
          assetNamePattern: "[name]_[version]_${{ matrix.system }}[ext]"
          args: ${{ format('--bundles {0} {1} --config {2}', matrix.bundles, matrix.target && format('--target {0}', matrix.target) || '', matrix.no_cores && '{"bundle":{"createUpdaterArtifacts":true}}' || '{"bundle":{"createUpdaterArtifacts":true,"resources":{"resources/cores/":"cores/"}}}') }}

  # The desktop updater's manifest, written once every desktop build has uploaded its
  # signed package: builds that each added their part could overwrite each other's. The
  # signatures go into it, and their own files leave the release page.
  # It runs even when a build failed or found no machine (GitHub's Macs are often busy),
  # so the other systems still get the update; re-running that build writes it again.
  updater:
    needs: desktop
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/updater-json.mjs "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One APK for every Android device: it carries the app and the cores for 64-bit phones
  # and for 32-bit phones and TVs, and Android installs the half that fits.
  android:
    if: inputs.only != 'desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      # The cores change only when android-cores.json pins new versions.
      - id: cores
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
            src-tauri/gen/android/app/src/main/jniLibs/armeabi-v7a
          key: android-cores-${{ hashFiles('scripts/android-cores.json', 'scripts/android-cores.mjs') }}
      - if: steps.cores.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Cores for Android
        if: steps.cores.outputs.cache-hit != 'true'
        run: node scripts/android-cores.mjs arm64-v8a armeabi-v7a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the APK
        env:
          # The APK signing key: every release must use the same one to install as an update.
          KEYSTORE_BASE64: ${{ secrets.KOVA_ANDROID_KEYSTORE }}
          KOVA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KOVA_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kova.jks"
          export KOVA_ANDROID_KEYSTORE="$RUNNER_TEMP/kova.jks"
          npx tauri android build --apk --target aarch64 --target armv7
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n 1)" "Kova_${GITHUB_REF_NAME#v}_Android.apk"
      # A build that isn't a release (a dry run on a branch) keeps its APK to try out.
      - name: Keep the APK
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kova_Android
          path: Kova_*_Android.apk
          retention-days: 14
      # The desktop builds create the draft release; this one may be ready first.
      - name: Add it to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; sleep 20; done
          apk="Kova_${GITHUB_REF_NAME#v}_Android.apk"
          files=("$apk")
          # Kova up to 0.1.18-beta.1 updates itself only from an APK named after the
          # processor. The 0.1.18 releases carry the same APK under those names too, so
          # older installs still reach 0.1.18, which looks for the new name.
          if [[ "$GITHUB_REF_NAME" == v0.1.18* ]]; then
            for p in arm64 armv7; do
              cp "$apk" "Kova_${GITHUB_REF_NAME#v}_android-$p.apk"
              files+=("Kova_${GITHUB_REF_NAME#v}_android-$p.apk#Same APK, for in-app updates from older Kova")
            done
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
